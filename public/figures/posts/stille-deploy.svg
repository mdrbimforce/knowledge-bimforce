<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">Zes weken dezelfde versie</title>
  <desc id="sd-desc">Een tijdlijn van 22 juli tot begin september. De server blijft al die tijd op dezelfde versie staan terwijl het dashboard er normaal uitziet. Daaronder de oplossing: een ochtendcontrole die zich elke dag meldt, ook als alles in orde is.</desc>
  <style>text { font-family: 'Myriad Pro', system-ui, sans-serif; }</style>

  <!-- tijdlijn -->
  <text x="20" y="30" fill="#1c2a41" font-size="15" font-weight="700">Versie op de server</text>
  <line x1="40" y1="90" x2="480" y2="90" stroke="#bbbfc6" stroke-width="2"/>
  <line x1="40" y1="70" x2="440" y2="70" stroke="#0c6980" stroke-width="10" stroke-linecap="round"/>
  <text x="40" y="112" fill="#475365" font-size="12">22 juli</text>
  <text x="440" y="112" text-anchor="end" fill="#475365" font-size="12">begin september</text>
  <text x="240" y="58" text-anchor="middle" fill="#0c6980" font-size="12" font-weight="700">steeds dezelfde versie · zes weken</text>
  <!-- groene vinkjes: alles lijkt normaal -->
  <g fill="none" stroke="#00a8a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 90 136 l 6 6 l 12 -12"/>
    <path d="M 190 136 l 6 6 l 12 -12"/>
    <path d="M 290 136 l 6 6 l 12 -12"/>
    <path d="M 390 136 l 6 6 l 12 -12"/>
  </g>
  <text x="250" y="168" text-anchor="middle" fill="#475365" font-size="12">voor iedereen die het dashboard gebruikte, zag alles er normaal uit</text>
  <!-- rode stip: ontdekking -->
  <circle cx="462" cy="70" r="9" fill="#BB0303"/>
  <text x="462" y="46" text-anchor="middle" fill="#BB0303" font-size="11" font-weight="700">ontdekt</text>

  <!-- oplossing -->
  <rect x="40" y="196" width="440" height="84" rx="10" fill="#c0f0f7" fill-opacity="0.5" stroke="#0c6980" stroke-width="1.5"/>
  <text x="60" y="222" fill="#0c6980" font-size="13" font-weight="700">Nu: elke ochtend een controle</text>
  <text x="60" y="243" fill="#1c2a41" font-size="12">kan de server bij elke repository? loopt een werkkopie achter?</text>
  <text x="60" y="260" fill="#1c2a41" font-size="12">hoeveel dagen is het token nog geldig?</text>
  <text x="60" y="275" fill="#475365" font-size="11" font-style="italic">meldt zich altijd, ook als alles in orde is</text>
</svg>
