<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">Van werkgeheugen naar publicatie</title>
  <desc id="pt-desc">Een trechter in drie stappen: ruim 8.200 geheugenfragmenten vastgelegd tijdens het werk, 183 contentitems waarvan 148 op concept, en 2 gepubliceerd. Onderaan de oplossing: een dagelijkse route die elk gepland stuk ter goedkeuring voorlegt.</desc>
  <!-- Cijfers uit content-1788330813261 (marketingpipeline-post, 28-09-2026). -->
  <style>text { font-family: 'Myriad Pro', system-ui, sans-serif; }</style>

  <polygon points="40,40 480,40 430,95 90,95" fill="#0c6980"/>
  <text x="260" y="66" text-anchor="middle" fill="#fdfdfd" font-size="16" font-weight="700">8.231 fragmenten</text>
  <text x="260" y="84" text-anchor="middle" fill="#c0f0f7" font-size="11">vastgelegd tijdens het werk</text>

  <polygon points="95,102 425,102 375,157 145,157" fill="#00a8a8"/>
  <text x="260" y="128" text-anchor="middle" fill="#fdfdfd" font-size="16" font-weight="700">183 contentitems</text>
  <text x="260" y="146" text-anchor="middle" fill="#1c2a41" font-size="11">waarvan 148 op concept</text>

  <polygon points="150,164 370,164 330,214 190,214" fill="#E65F59"/>
  <text x="260" y="194" text-anchor="middle" fill="#fdfdfd" font-size="16" font-weight="700">2 gepubliceerd</text>

  <rect x="90" y="236" width="340" height="44" rx="10" fill="#c0f0f7" fill-opacity="0.6" stroke="#0c6980" stroke-width="1.5"/>
  <text x="260" y="256" text-anchor="middle" fill="#0c6980" font-size="13" font-weight="700">Nu: een dagelijkse route per kanaal</text>
  <text x="260" y="272" text-anchor="middle" fill="#1c2a41" font-size="11">goedkeuren is publiceren</text>
</svg>
