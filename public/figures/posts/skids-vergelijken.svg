<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="sk-title sk-desc">
  <title id="sk-title">Welke skids raakt de nieuwe levering?</title>
  <desc id="sk-desc">Een verdieping met twaalf skids als vakjes: een deel is geraakt door de nieuwe modellevering, de rest is ongewijzigd. Rechts een leiding waarvan de diameter veranderde van 22 naar 28 millimeter, zoals je die per skid in de browser aanklikt.</desc>
  <style>text { font-family: 'Myriad Pro', system-ui, sans-serif; }</style>

  <text x="20" y="30" fill="#1c2a41" font-size="15" font-weight="700">Nieuwe levering: welke skids zijn geraakt?</text>

  <g transform="translate(20,60)">
    <rect x="0" y="0" width="48" height="36" rx="5" fill="#E65F59"/><rect x="56" y="0" width="48" height="36" rx="5" fill="#c0f0f7"/><rect x="112" y="0" width="48" height="36" rx="5" fill="#c0f0f7"/><rect x="168" y="0" width="48" height="36" rx="5" fill="#E65F59"/>
    <rect x="0" y="44" width="48" height="36" rx="5" fill="#c0f0f7"/><rect x="56" y="44" width="48" height="36" rx="5" fill="#E65F59"/><rect x="112" y="44" width="48" height="36" rx="5" fill="#c0f0f7"/><rect x="168" y="44" width="48" height="36" rx="5" fill="#c0f0f7"/>
    <rect x="0" y="88" width="48" height="36" rx="5" fill="#c0f0f7"/><rect x="56" y="88" width="48" height="36" rx="5" fill="#c0f0f7"/><rect x="112" y="88" width="48" height="36" rx="5" fill="#E65F59"/><rect x="168" y="88" width="48" height="36" rx="5" fill="#c0f0f7"/>
  </g>
  <!-- legenda -->
  <rect x="20" y="206" width="16" height="12" rx="3" fill="#E65F59"/>
  <text x="42" y="216" fill="#1c2a41" font-size="12">geraakt door de nieuwe levering</text>
  <rect x="20" y="226" width="16" height="12" rx="3" fill="#c0f0f7"/>
  <text x="42" y="236" fill="#1c2a41" font-size="12">ongewijzigd: de werkplaats kan door</text>
  <text x="20" y="270" fill="#475365" font-size="11" font-style="italic">schematisch: elk vakje is een skid</text>

  <!-- leiding met diameterwijziging -->
  <g transform="translate(290,100)">
    <text x="95" y="0" text-anchor="middle" fill="#475365" font-size="12">klik op een leiding</text>
    <rect x="0" y="22" width="80" height="18" fill="#0c6980"/>
    <polygon points="97,31 81,20 81,42" fill="#475365"/>
    <rect x="100" y="15" width="90" height="32" fill="#E65F59"/>
    <text x="40" y="70" text-anchor="middle" fill="#1c2a41" font-size="14" font-weight="700">ø22</text>
    <text x="145" y="70" text-anchor="middle" fill="#BB0303" font-size="14" font-weight="700">ø28 mm</text>
  </g>
</svg>
