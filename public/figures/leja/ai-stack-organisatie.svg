<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 402" role="img" aria-labelledby="ast-title ast-desc">
  <title id="ast-title">AI-stack voor uw organisatie: drie modellen</title>
  <desc id="ast-desc">Drie manieren om een eigen AI-stack neer te zetten. Model A, wij leveren: per organisatie een gehoste AI-instantie met GRiDS-project; wij beheren, u gebruikt, tegen een maandelijks tarief. Model B, u host: wij leveren software, database en expertise en helpen met opzetten; u beheert de eigen infrastructuur. Model C, samen bouwen: volledig open, samen een domeinmodel bouwen en publiceren via bSDD. Een pijl loopt van meer ontzorgd naar meer eigen regie. Welk model past hangt af van portefeuille-grootte, eigen data- en IT-capaciteit en strategische ambitie.</desc>
  <!-- Bron: leja-marketing/decks/ultimate-leja-zgem-2026-05-22/slides.md, dia "AI-stack voor uw organisatie" (r. 5621-5670), omgezet van tekstkaarten naar diagram (statische eindstand van de click-reveal, 2026-09-26) -->
