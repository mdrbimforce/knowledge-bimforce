  <text x="350" y="24" text-anchor="middle" fill="#1c2a41" font-size="16" font-weight="700">Eén architectuur, elke organisatie haar eigen AI-stack</text>
  <text x="350" y="44" text-anchor="middle" fill="#475365" font-size="12.5">Portefeuille-agnostisch: de keuze is welk model voor uw organisatie de meeste kansen biedt.</text>
