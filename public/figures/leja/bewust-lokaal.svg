<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 268" role="img" aria-labelledby="blk-title blk-desc">
  <title id="blk-title">Bewust lokaal: geheugen en dashboard onder eigen dak</title>
  <desc id="blk-desc">Twee plaatjes. Links rijdt een vrachtwagen met het gedeelde geheugen van een clouddienst naar een eigen hal: het geheugen verhuisde in juli 2026 naar een eigen server. Rechts staan in de eigen hal een lokaal AI-model en een beeldscherm: het dashboard draait standaard op een lokaal model op de eigen GPU.</desc>
