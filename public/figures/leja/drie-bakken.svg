<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" role="img" aria-labelledby="bak-title bak-desc">
  <title id="bak-title">Drie bakken: welke data mag waar naartoe</title>
  <desc id="bak-desc">Drie bakken naast elkaar. Vrij bruikbaar: openbare normen en standaarden, eigen publicaties, algemene vakvragen. Met Claude, gericht: het ontwerp van AI-workflows, documentatie en presentaties, en alleen de context die voor de vraag nodig is. Blijft in de hal: productiecode, het gedeelde geheugen, klant- en projectdata. Een pijl loopt van openbaar naar de eigen kern.</desc>
