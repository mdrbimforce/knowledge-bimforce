<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 276" role="img" aria-labelledby="t d">
  <title id="t">Data, spoor en controle</title>
  <desc id="d">Strip in drie plaatjes. Eén: vier dataklassen als vier kasten, van openbaar tot persoonsgegevens; een mens met een map kiest de klasse en de afspraak met de klant gaat voor. Twee: elke handeling van de AI staat in een spoor met model, invoer en wie het zag, geketend zodat het niet weg kan; de klant kan erin kijken. Drie: een controleladder met drie treden, van informatief tot beslissend; bovenaan kijkt een tweede paar ogen mee.</desc>
  <!-- Bron: AI-beleid bimforce en Leja v1.0 (knowledge-bimforce-ai-beleid), uitgangspunten 3 en 4 en de controleladder, 2026-10-27 -->
