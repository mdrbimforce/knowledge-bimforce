<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 276" role="img" aria-labelledby="alm-title alm-desc">
  <title id="alm-title">Productiecode: AI leest mee, een mens beslist</title>
  <desc id="alm-desc">Strip in drie plaatjes. Eén: de AI bekijkt de code met een vergrootglas; de AI mag de code lezen. Twee: de AI geeft een voorstel aan een ontwikkelaar; de AI mag voorstellen doen. Drie: de ontwikkelaar beoordeelt het voorstel en voegt het zelf toe aan productie. Een AI schrijft niet rechtstreeks in de productiecode.</desc>
