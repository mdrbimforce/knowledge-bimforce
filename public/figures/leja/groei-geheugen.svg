<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="gg-title gg-desc">
  <title id="gg-title">Omvang van het geheugen tegenover de oude limiet</title>
  <desc id="gg-desc">Vier balken op dezelfde schaal. De limiet van de gratis clouddienst: 200.000 knopen. De hele database bij de verhuizing in juli 2026: 52.490 knopen. Daarvan het eigen geheugen van Leja eind september 2026: 50.740 knopen. De hele database eind september 2026, inclusief domeinkennis en een GRiDS-sandbox: 2.320.805 knopen, ruim elf keer de oude limiet.</desc>
  <!-- Cijfers: migratierapport juli 2026 en telling op neo4j-leja, 26-09-2026. Schaal lineair, 1 px = 4.642 knopen. -->
  <style>text { font-family: 'Myriad Pro', system-ui, sans-serif; }</style>

  <text x="10" y="24" fill="#1c2a41" font-size="15" font-weight="700">Aantal knopen in de database (zelfde schaal)</text>

  <text x="10" y="62" fill="#1c2a41" font-size="12">Limiet gratis clouddienst</text>
  <rect x="200" y="48" width="43" height="20" fill="#bbbfc6"/>
  <text x="251" y="63" fill="#475365" font-size="12" font-weight="700">200.000</text>

  <text x="10" y="102" fill="#1c2a41" font-size="12">Hele database, juli 2026</text>
  <rect x="200" y="88" width="11" height="20" fill="#0c6980"/>
  <text x="221" y="103" fill="#475365" font-size="12" font-weight="700">52.490</text>

  <text x="10" y="142" fill="#1c2a41" font-size="12">Eigen geheugen AI, sept. 2026</text>
  <rect x="200" y="128" width="11" height="20" fill="#0c6980"/>
  <text x="221" y="143" fill="#475365" font-size="12" font-weight="700">50.740</text>

  <text x="10" y="182" fill="#1c2a41" font-size="12">Hele database, sept. 2026</text>
  <text x="10" y="197" fill="#747d8b" font-size="11">incl. domeinkennis en sandbox</text>
  <rect x="200" y="168" width="500" height="20" fill="#00a8a8"/>
  <text x="700" y="209" text-anchor="end" fill="#1c2a41" font-size="13" font-weight="700">2.320.805 · ruim 11× de oude limiet</text>

  <line x1="243" y1="40" x2="243" y2="236" stroke="#BB0303" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="249" y="236" fill="#BB0303" font-size="11">oude limiet</text>
</svg>
