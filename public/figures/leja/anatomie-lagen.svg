<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 358" role="img" aria-labelledby="anat-title anat-desc">
  <title id="anat-title">Anatomie van de AI: lichaam en acht lagen brein</title>
  <desc id="anat-desc">Links een poppetje met een GPU-server als lijf (A5000). In het hoofd zes gekleurde lagen, een stippelring voor zelflerend vermogen en twee oren: Claude Code (externe agent) en OpenRouter (toegang tot specialistische modellen zoals Claude en DeepSeek). Rechts dezelfde lagen als stapel: Github, Neo4j formeel, Neo4j domeinkennis, Neo4j informeel, LoRA (in ontwikkeling) en het taalmodel Qwen3.6-27B, samen omkaderd door de orchestrator Hermes.</desc>
