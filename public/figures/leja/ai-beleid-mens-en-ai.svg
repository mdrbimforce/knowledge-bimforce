<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 276" role="img" aria-labelledby="t d">
  <title id="t">Zo werken mens en AI samen bij bimforce</title>
  <desc id="d">Strip in drie plaatjes. Eén: de AI schrijft een concept, een mens controleert het en tekent. Twee: de AI handelt alleen langs een afgesproken pad met een poort; alles daarbuiten wacht op een mens. Drie: op een stuk dat naar een klant gaat staat dat AI is gebruikt en wie het heeft gecontroleerd.</desc>
