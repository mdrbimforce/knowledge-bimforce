<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="dz-title dz-desc">
  <title id="dz-title">Drie zones: waar de AI mag lezen en schrijven</title>
  <desc id="dz-desc">Drie panelen. Eigen omgeving (het brein, het dashboard en de kennissite): lezen en schrijven, de AI beheert het zelf. Test-omgevingen: lezen en schrijven, maar alleen vanuit werksessies op een werkplek of via een route, niet vanaf de server. Productie: alleen via twee API's, een lees-API waarmee alles bevraagbaar is en een schrijf-API voor specifieke taken waarbij elke aanroep aan een gebruiker gekoppeld is; deze zone is een doelbeeld en nog niet gebouwd.</desc>
  <!-- Doelbeeld Martijn de Riet, 2026-09-26 (decision in neo4j-leja, quest-138). -->
  <style>text { font-family: 'Myriad Pro', system-ui, sans-serif; }</style>

  <!-- zone 1 -->
  <g transform="translate(10,10)">
    <rect width="220" height="300" rx="12" fill="#c0f0f7" fill-opacity="0.45" stroke="#0c6980" stroke-width="2"/>
    <text x="110" y="32" text-anchor="middle" fill="#0c6980" font-size="12" font-weight="700" letter-spacing="1">ZONE 1</text>
    <text x="110" y="54" text-anchor="middle" fill="#1c2a41" font-size="17" font-weight="700">Eigen omgeving</text>
    <path d="M 80 82 L 80 128 Q 80 136 110 136 Q 140 136 140 128 L 140 82" fill="#0c6980"/>
    <ellipse cx="110" cy="82" rx="30" ry="8" fill="#0c6980" stroke="#075062" stroke-width="1.5"/>
    <text x="110" y="162" text-anchor="middle" fill="#1c2a41" font-size="12">het brein · het dashboard</text>
    <text x="110" y="178" text-anchor="middle" fill="#1c2a41" font-size="12">de kennissite</text>
    <rect x="30" y="200" width="160" height="30" rx="15" fill="#0c6980"/>
    <text x="110" y="220" text-anchor="middle" fill="#fdfdfd" font-size="13" font-weight="700">lezen + schrijven</text>
    <text x="110" y="256" text-anchor="middle" fill="#475365" font-size="12">database én code</text>
    <text x="110" y="272" text-anchor="middle" fill="#475365" font-size="12">de AI beheert het zelf</text>
  </g>

  <!-- zone 2 -->
  <g transform="translate(250,10)">
    <rect width="220" height="300" rx="12" fill="#DECFBA" fill-opacity="0.35" stroke="#C9B49F" stroke-width="2"/>
    <text x="110" y="32" text-anchor="middle" fill="#7A303D" font-size="12" font-weight="700" letter-spacing="1">ZONE 2</text>
    <text x="110" y="54" text-anchor="middle" fill="#1c2a41" font-size="17" font-weight="700">Test-omgevingen</text>
    <path d="M 80 82 L 80 128 Q 80 136 110 136 Q 140 136 140 128 L 140 82" fill="#657082"/>
    <ellipse cx="110" cy="82" rx="30" ry="8" fill="#657082" stroke="#475365" stroke-width="1.5"/>
    <text x="110" y="162" text-anchor="middle" fill="#1c2a41" font-size="12">testdatabases</text>
    <text x="110" y="178" text-anchor="middle" fill="#1c2a41" font-size="12">en proefomgevingen</text>
    <rect x="30" y="200" width="160" height="30" rx="15" fill="#657082"/>
    <text x="110" y="220" text-anchor="middle" fill="#fdfdfd" font-size="13" font-weight="700">lezen + schrijven</text>
    <text x="110" y="256" text-anchor="middle" fill="#475365" font-size="12">alleen vanuit een werksessie</text>
    <text x="110" y="272" text-anchor="middle" fill="#475365" font-size="12">of via een route,</text>
    <text x="110" y="288" text-anchor="middle" fill="#475365" font-size="12">niet vanaf de server</text>
  </g>

  <!-- zone 3 -->
  <g transform="translate(490,10)">
    <rect width="220" height="300" rx="12" fill="#1c2a41" fill-opacity="0.06" stroke="#1c2a41" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="110" y="32" text-anchor="middle" fill="#1c2a41" font-size="12" font-weight="700" letter-spacing="1">ZONE 3</text>
    <text x="110" y="54" text-anchor="middle" fill="#1c2a41" font-size="17" font-weight="700">Productie</text>
    <path d="M 80 82 L 80 128 Q 80 136 110 136 Q 140 136 140 128 L 140 82" fill="#1c2a41"/>
    <ellipse cx="110" cy="82" rx="30" ry="8" fill="#1c2a41" stroke="#0c1219" stroke-width="1.5"/>
    <rect x="18" y="150" width="184" height="46" rx="8" fill="#fdfdfd" stroke="#0c6980" stroke-width="1.5"/>
    <text x="110" y="169" text-anchor="middle" fill="#0c6980" font-size="13" font-weight="700">Lees-API</text>
    <text x="110" y="186" text-anchor="middle" fill="#475365" font-size="11">de hele structuur bevraagbaar</text>
    <rect x="18" y="204" width="184" height="58" rx="8" fill="#fdfdfd" stroke="#BB0303" stroke-width="1.5"/>
    <text x="110" y="223" text-anchor="middle" fill="#BB0303" font-size="13" font-weight="700">Schrijf-API</text>
    <text x="110" y="240" text-anchor="middle" fill="#475365" font-size="11">specifieke taken, via routes of UI</text>
    <text x="110" y="255" text-anchor="middle" fill="#475365" font-size="11">elke aanroep aan een gebruiker</text>
    <rect x="40" y="272" width="140" height="22" rx="11" fill="#E65F59"/>
    <text x="110" y="287" text-anchor="middle" fill="#fdfdfd" font-size="11" font-weight="700">doelbeeld, in aanbouw</text>
  </g>
</svg>
