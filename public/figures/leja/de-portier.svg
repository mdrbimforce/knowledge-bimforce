<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 640 384" role="img" aria-labelledby="prt-title prt-desc">
  <title id="prt-title">De portier: lokaal waar het kan, extern alleen als het moet</title>
  <desc id="prt-desc">Een hal met daarin een lokaal AI-model, waar al het werk standaard begint. Bij de deur staat een portier. Alleen als het moet gaat een gestippelde lijn naar buiten, naar het externe model Claude. Naar buiten alleen als het werk expliciet zwaar is, de vraag te groot is voor het lokale model of het lokale model faalt. Vangrails: een dagbudget voor externe kosten, een noodknop die alleen de buitendeur sluit, elke aanroep gelogd en, in opbouw, per domein een lijst van toegestane externe modellen.</desc>
